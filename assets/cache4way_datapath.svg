<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1280"
   height="760"
   viewBox="0 0 1280 760"
   version="1.1"
   id="cache4way-datapath"
   sodipodi:docname="cache4way_datapath.svg"
   inkscape:version="1.3"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview-cache4way"
     pagecolor="#f6f3ed"
     bordercolor="#0f172a"
     borderopacity="0.25"
     inkscape:pageopacity="1"
     inkscape:deskcolor="#e7e2d8"
     inkscape:document-units="px" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <style><![CDATA[
      .title { font: 700 28px Georgia, serif; fill: #1e293b; }
      .subtitle { font: 500 14px Georgia, serif; fill: #64748b; }
      .label { font: 700 13px Georgia, serif; fill: #334155; }
      .small { font: 500 12px Georgia, serif; fill: #475569; }
      .value { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .tiny-value { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .panel { fill: #fffaf0; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .signal { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; rx: 10; }
      .control { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 12; }
      .memory { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 12; }
      .logic { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 12; }
      .way-card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .way-card.selected { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .event-badge { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .event-badge.hit { fill: #dcfce7; stroke: #16a34a; }
      .event-badge.miss { fill: #ffedd5; stroke: #ea580c; }
      .event-badge.replace { fill: #fee2e2; stroke: #dc2626; }
      .bus { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin-bus { stroke: #64748b; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .muted-line { stroke: #cbd5e1; stroke-width: 1.4; fill: none; }
      .chip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .lru { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 8; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#f6f3ed" />
  <text x="42" y="48" class="title">Cache 4-Way Read-Only Datapath</text>
  <text x="44" y="74" class="subtitle">Fluxo didatico: endereco -> comparacao de tags -> selecao da via -> dado ou preenchimento por miss</text>

  <rect id="event-badge" class="event-badge" x="996" y="30" width="230" height="56" />
  <text x="1016" y="54" class="label">Evento</text>
  <text x="1016" y="76" class="value">@event</text>

  <rect class="panel" x="36" y="112" width="244" height="142" />
  <text x="58" y="140" class="label">Endereco de entrada</text>
  <rect class="signal" x="58" y="158" width="198" height="42" />
  <text x="76" y="184" class="value">addr = @addr</text>
  <text x="58" y="224" class="small">RAM_BITS=12, bloco=4 bytes</text>

  <path class="bus" d="M 280 183 C 310 183, 320 183, 350 183" />

  <rect class="panel" x="350" y="112" width="268" height="142" />
  <text x="372" y="140" class="label">Separador de campos</text>
  <rect class="signal" x="372" y="158" width="72" height="42" />
  <rect class="signal" x="456" y="158" width="72" height="42" />
  <rect class="signal" x="540" y="158" width="56" height="42" />
  <text x="384" y="177" class="small">tag</text>
  <text x="384" y="194" class="value">@tag</text>
  <text x="468" y="177" class="small">line</text>
  <text x="472" y="194" class="value">@line</text>
  <text x="548" y="177" class="small">blk</text>
  <text x="552" y="194" class="value">@blk</text>
  <text x="372" y="224" class="small">tag = addr[11:4], line = addr[3:2], blk = addr[1:0]</text>

  <path class="bus" d="M 618 183 C 650 183, 650 303, 680 303" />
  <path class="thin-bus" d="M 492 254 C 492 285, 514 303, 548 303" />

  <rect class="panel" x="684" y="104" width="430" height="512" />
  <text x="706" y="132" class="label">Conjunto selecionado pela line @line</text>
  <text x="706" y="154" class="small">As quatro vias sao consultadas em paralelo.</text>

  <g id="way0-group">
    <rect id="way0-card" class="way-card" x="706" y="180" width="386" height="86" />
    <text x="724" y="206" class="label">Way 0</text>
    <rect class="chip" x="724" y="220" width="76" height="28" />
    <text x="734" y="239" class="tiny-value">V=@valid0</text>
    <rect class="chip" x="812" y="220" width="86" height="28" />
    <text x="822" y="239" class="tiny-value">Tag=@tag0</text>
    <rect class="lru" x="910" y="220" width="72" height="28" />
    <text x="924" y="239" class="tiny-value">LRU=@lru0</text>
    <rect class="memory" x="994" y="214" width="78" height="38" />
    <text x="1014" y="238" class="tiny-value">Data0</text>
  </g>

  <g id="way1-group">
    <rect id="way1-card" class="way-card" x="706" y="284" width="386" height="86" />
    <text x="724" y="310" class="label">Way 1</text>
    <rect class="chip" x="724" y="324" width="76" height="28" />
    <text x="734" y="343" class="tiny-value">V=@valid1</text>
    <rect class="chip" x="812" y="324" width="86" height="28" />
    <text x="822" y="343" class="tiny-value">Tag=@tag1</text>
    <rect class="lru" x="910" y="324" width="72" height="28" />
    <text x="924" y="343" class="tiny-value">LRU=@lru1</text>
    <rect class="memory" x="994" y="318" width="78" height="38" />
    <text x="1014" y="342" class="tiny-value">Data1</text>
  </g>

  <g id="way2-group">
    <rect id="way2-card" class="way-card" x="706" y="388" width="386" height="86" />
    <text x="724" y="414" class="label">Way 2</text>
    <rect class="chip" x="724" y="428" width="76" height="28" />
    <text x="734" y="447" class="tiny-value">V=@valid2</text>
    <rect class="chip" x="812" y="428" width="86" height="28" />
    <text x="822" y="447" class="tiny-value">Tag=@tag2</text>
    <rect class="lru" x="910" y="428" width="72" height="28" />
    <text x="924" y="447" class="tiny-value">LRU=@lru2</text>
    <rect class="memory" x="994" y="422" width="78" height="38" />
    <text x="1014" y="446" class="tiny-value">Data2</text>
  </g>

  <g id="way3-group">
    <rect id="way3-card" class="way-card" x="706" y="492" width="386" height="86" />
    <text x="724" y="518" class="label">Way 3</text>
    <rect class="chip" x="724" y="532" width="76" height="28" />
    <text x="734" y="551" class="tiny-value">V=@valid3</text>
    <rect class="chip" x="812" y="532" width="86" height="28" />
    <text x="822" y="551" class="tiny-value">Tag=@tag3</text>
    <rect class="lru" x="910" y="532" width="72" height="28" />
    <text x="924" y="551" class="tiny-value">LRU=@lru3</text>
    <rect class="memory" x="994" y="526" width="78" height="38" />
    <text x="1014" y="550" class="tiny-value">Data3</text>
  </g>

  <rect class="logic" x="548" y="272" width="104" height="62" />
  <text x="570" y="296" class="label">Comparar</text>
  <text x="570" y="316" class="small">tag + valid</text>
  <path class="thin-bus" d="M 652 303 C 672 303, 672 223, 704 223" />
  <path class="thin-bus" d="M 652 303 C 672 303, 672 327, 704 327" />
  <path class="thin-bus" d="M 652 303 C 672 303, 672 431, 704 431" />
  <path class="thin-bus" d="M 652 303 C 672 303, 672 535, 704 535" />

  <rect class="logic" x="1134" y="238" width="104" height="74" />
  <text x="1158" y="264" class="label">Encoder</text>
  <text x="1152" y="284" class="small">hit bits</text>
  <text x="1152" y="302" class="value">hit=@hit</text>

  <rect class="logic" x="1134" y="358" width="104" height="74" />
  <text x="1168" y="384" class="label">Mux</text>
  <text x="1150" y="404" class="small">4:1 data</text>
  <text x="1150" y="422" class="value">way=@selected_way</text>

  <rect class="signal" x="1134" y="478" width="104" height="58" />
  <text x="1154" y="502" class="label">Saida</text>
  <text x="1154" y="522" class="value">@dout</text>

  <path class="bus" d="M 1092 223 C 1114 223, 1114 274, 1134 274" />
  <path class="bus" d="M 1092 327 C 1114 327, 1114 274, 1134 274" />
  <path class="bus" d="M 1092 431 C 1114 431, 1114 274, 1134 274" />
  <path class="bus" d="M 1092 535 C 1114 535, 1114 274, 1134 274" />
  <path class="bus" d="M 1186 312 C 1186 330, 1186 338, 1186 358" />
  <path class="bus" d="M 1186 432 C 1186 452, 1186 458, 1186 478" />

  <rect class="control" x="48" y="328" width="172" height="84" />
  <text x="72" y="356" class="label">FSM principal</text>
  <text x="72" y="378" class="small">estado atual</text>
  <text x="72" y="400" class="value">@state</text>

  <rect class="control" x="260" y="328" width="166" height="84" />
  <text x="284" y="356" class="label">Decoder 2:4</text>
  <text x="284" y="378" class="small">habilita escrita</text>
  <text x="284" y="400" class="value">way @selected_way</text>

  <rect class="control" x="466" y="328" width="144" height="84" />
  <text x="492" y="356" class="label">LRU</text>
  <text x="486" y="378" class="small">vitima/idade</text>
  <text x="486" y="400" class="value">@lru0 @lru1 @lru2 @lru3</text>

  <path class="bus" d="M 220 370 C 238 370, 242 370, 260 370" />
  <path class="bus" d="M 426 370 C 444 370, 448 370, 466 370" />
  <path class="thin-bus" d="M 610 370 C 650 370, 650 578, 704 578" />

  <rect class="memory" x="74" y="500" width="176" height="88" />
  <text x="118" y="532" class="label">RAM</text>
  <text x="96" y="556" class="small">preenche bloco</text>
  <text x="96" y="578" class="value">addr @addr</text>

  <rect class="control" x="300" y="500" width="162" height="88" />
  <text x="332" y="532" class="label">Contador</text>
  <text x="326" y="556" class="small">offset do bloco</text>
  <text x="326" y="578" class="value">blk @blk</text>

  <path class="bus" d="M 250 544 C 272 544, 278 544, 300 544" />
  <path class="bus" d="M 462 544 C 560 544, 596 592, 704 592" />

  <rect class="panel" x="48" y="642" width="1180" height="72" />
  <text x="72" y="670" class="label">Resumo do passo</text>
  <text x="72" y="696" class="value">event=@event | addr=@addr | tag=@tag | line=@line | blk=@blk | hit=@hit | selected_way=@selected_way | dout=@dout | state=@state</text>
</svg>
